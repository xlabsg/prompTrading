[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube_processor"
version = "0.1.0"
description = "YouTube video audio transcription for PrompTrading"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "openai-whisper>=20231117",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["youtube_processor*"]
