[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data"
version = "0.1.0"
description = "Market data providers (OKX, Binance, US stocks) with a shared OHLCV cache"
requires-python = ">=3.13"
dependencies = [
    "pandas>=1.5",
    "requests>=2.31",
    # Parquet backend for the shared market-data cache.
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
# Only needed for the us_stock provider.
us-stock = ["yfinance>=0.2"]

[tool.setuptools.packages.find]
include = ["data*"]
exclude = ["tests*"]
