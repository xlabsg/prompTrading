name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e packages/control_plane
          pip install -e packages/data
          pip install -e packages/backtest
          pip install -e packages/live_trading_sdk
          pip install -e packages/agent
          pip install -e packages/okx_sdk
          pip install -e 'services/api[test]'

      - name: Lint with Ruff
        run: |
          ruff check packages/control_plane packages/agent packages/backtest packages/data services/api

      - name: Run Backend Tests
        env:
          APP_WORKSPACES_DIR: /tmp/workspaces
          APP_DB_URL: sqlite:////tmp/workspaces/app.db
          WORKSPACES_DIR: /tmp/workspaces
          DB_URL: sqlite:////tmp/workspaces/app.db
          JWT_SECRET: ci-testing-jwt-secret-key-1234567890
          OPENAI_API_KEY: mock-test-key
          DEEPSEEK_API_KEY: mock-test-key
        run: |
          sudo mkdir -p /workspaces && sudo chmod 777 /workspaces
          mkdir -p /tmp/workspaces
          pytest -v packages/control_plane
          pytest -v packages/data
          pytest -v packages/backtest
          pytest -v packages/agent/tests
          pytest -v services/api

  frontend-quality:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Production Build
        working-directory: apps/web
        run: npm run build
