name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e packages/control_plane
          pip install -e packages/data
          pip install -e packages/backtest
          pip install -e packages/agent
          pip install -e packages/okx_sdk
          pip install -e 'services/api[test]'

      - name: Lint with Ruff
        run: |
          ruff check packages/control_plane services/api

      - name: Run Backend Tests
        run: |
          pytest -v packages/control_plane
          pytest -v services/api

  frontend-quality:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Production Build
        working-directory: apps/web
        run: npm run build
