[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-trading-worker"
version = "0.1.0"
description = "PrompTrading background job processor"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.115.11",
    "uvicorn[standard]>=0.34.2",
    "redis>=5.2.1",
    "requests>=2.32.3",
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "TA-Lib>=0.6.8",
    "yfinance>=0.2.55",
    "pyarrow>=19.0.0",
    "PyYAML>=6.0.2",
    "PyJWT>=2.10.1",
    "cryptography>=44.0.1",
    "sqlalchemy>=2.0.38",
    "psycopg[binary]>=3.2.5",
    "pydantic>=2.11.0,<3",
    "pydantic-settings>=2.8.1",
    "APScheduler>=3.11.0",
    "openai>=1.65.0",
    "langfuse>=2.60.0",
    "psutil>=7.0.0",
]

# Local packages are installed from ./packages by the Dockerfile.

[tool.setuptools]
packages = []
