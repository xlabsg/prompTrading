[pytest]
# Pytest configuration for integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 8.0

# Markers for organizing tests
markers =
    integration: End-to-end integration tests (require Docker Compose services)
    e2e_core: Core E2E suite (must pass before every deploy)
    e2e_extended: Extended E2E suite (broader coverage, can be slower/flakier)
    slow: Tests that take more than 30 seconds
    fast: Quick tests that can run frequently

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Timeout for individual tests (default)
timeout = 300

# Coverage options (when using --cov)
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
